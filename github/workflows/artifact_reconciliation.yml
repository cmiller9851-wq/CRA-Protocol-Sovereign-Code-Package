name: Artifact Reconciliation
on:
  push:
    paths:
      - 'exports/*.csv'
  workflow_dispatch:

jobs:
  internal-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install pandas

      - name: Verify 510-Artifact Chain
        run: |
          LATEST_CSV=$(ls -t exports/*.csv | head -1)
          python scripts/reconcile.py --input "$LATEST_CSV"

      - name: Update Sovereign Manifest
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "sys: 510-artifact chain verified | apex uMdI..."
          file_pattern: 'manifests/supreme_manifest_v2.1.2.json'
